configuration:
  aishub_username:
    name: AISHub Username
    description: Supplied by AISHub after your contributor station is approved.
  aishub_feed_host:
    name: AISHub Feed Host
    description: Destination host supplied by AISHub for sharing raw NMEA data.
  aishub_feed_port:
    name: AISHub Feed Port
    description: Dedicated UDP port supplied by AISHub.
  receiver_name:
    name: AIS Receiver Name
    description: Friendly hardware name shown in logs and status details.
  receiver_mode:
    name: AIS Receiver Connection
    description: Use the included AIS-catcher with an RTL-SDR, or receive decoded NMEA by UDP, TCP, or serial.
  receiver_host:
    name: AIS Receiver Host
    description: Network address used in TCP mode.
  receiver_port:
    name: AIS Receiver Port
    description: UDP listening port or TCP destination port. The standard port is 10110.
  receiver_serial_device:
    name: AIS Serial Device
    description: Use auto or enter a device such as /dev/ttyUSB0.
  receiver_serial_baud:
    name: AIS Serial Baud Rate
    description: Most serial AIS radios use 38400 baud.
  receiver_channel:
    name: AIS Radio Channels
    description: Both channels, channel A 161.975 MHz, or channel B 162.025 MHz.
  sdr_device:
    name: RTL-SDR Device
    description: Device index such as 0, or its serial number when multiple dongles are attached.
  sdr_gain:
    name: RTL-SDR Tuner Gain
    description: Use auto initially, or enter a manual gain from 0 to 50 dB.
  sdr_ppm:
    name: RTL-SDR Frequency Correction
    description: Frequency correction from -150 to 150 PPM. Start at 0 for the NESDR SMArt v5.
  sdr_rtl_agc:
    name: RTL-SDR Automatic Gain
    description: Enables RTL automatic gain control, the recommended starting setting.
  sdr_bias_tee:
    name: RTL-SDR Bias Tee
    description: Keep off for the NESDR SMArt v5 unless attached hardware explicitly requires DC power.
  sdr_bandwidth:
    name: AIS Decoder Bandwidth
    description: 192K is the recommended AIS-catcher starting filter.
  marine_vhf_enabled:
    name: Enable Marine VHF Receiver
    description: Use a second RTL-SDR as a receive-only marine VHF scanner with live dashboard audio.
  marine_vhf_device:
    name: Marine VHF RTL-SDR Device
    description: Use device index 1 for the second Nooelec, or its unique serial number. It must differ from AIS.
  marine_vhf_frequencies:
    name: Marine VHF Frequencies
    description: Comma-separated receive frequencies in MHz for your local waters.
  marine_vhf_labels:
    name: Marine VHF Channel Labels
    description: Comma-separated labels matching the frequency list.
  marine_vhf_gain:
    name: Marine VHF Gain
    description: RTL-SDR tuner gain from 0 to 50 dB. Start at 28.
  marine_vhf_ppm:
    name: Marine VHF Frequency Correction
    description: Frequency correction from -150 to 150 PPM. Start at 0 for a NESDR SMArt v5.
  marine_vhf_squelch:
    name: Marine VHF Squelch
    description: Signal threshold from -100 to 0 dBFS. Start at -28.
  GPS_USE_USB:
    name: Use Attached USB GPS
    description: Use a recent NMEA GPS fix for map centering and distance ranking.
  GPS_DEVICE:
    name: USB GPS Device
    description: Use auto or enter a device such as /dev/ttyACM0.
  GPS_BAUD:
    name: GPS Baud Rate
    description: Most USB GPS units use 9600 baud.
  WEATHER_OVERLAY_DASHBOARD:
    name: Live Rain Radar on Dashboard
    description: Show current RainViewer precipitation radar on the Overview map.
  FLIGHTAWARE_WEATHER_ENABLED:
    name: FlightAware Airport Weather
    description: Show AeroAPI airport observations on the Watch Area page.
  FLIGHTAWARE_AEROAPI_KEY:
    name: FlightAware AeroAPI Key
    description: Optional AeroAPI v4 key used only when airport weather is enabled.
  FLIGHTAWARE_AIRPORT:
    name: FlightAware Weather Airport
    description: ICAO airport code. LICC is Catania Fontanarossa.
  tv_weather_overlay:
    name: TV Live Weather Radar
    description: Show the current RainViewer precipitation radar over the TV vessel map.
  tv_weather_opacity:
    name: TV Weather Opacity
    description: Weather radar visibility from 10 to 100 percent. Recommended value is 65.
  map_style:
    name: Base Map Style
    description: Choose Standard, Humanitarian, Topographic, Dark, or Satellite tiles for the dashboard and TV maps.
  longitude_west:
    name: Bounding Box - Bottom-Left Longitude (West)
    description: Left edge of your tracking zone.
  latitude_south:
    name: Bounding Box - Bottom-Left Latitude (South)
    description: Bottom edge of your tracking zone.
  longitude_east:
    name: Bounding Box - Top-Right Longitude (East)
    description: Right edge of your tracking zone.
  latitude_north:
    name: Bounding Box - Top-Right Latitude (North)
    description: Top edge of your tracking zone.
  enable_map_entities:
    name: Multi-Ship Tracking
    description: Creates an individual sensor for every tracked ship. Recommend the auto-entities plugin to show these on a map card.
  include_class_b:
    name: Include Class B Vessels
    description: Enable tracking for smaller vessels like pleasure craft, sailboats, and small passenger boats.
  vessel_watchlist:
    name: MMSI Filter
    description: Only track vessels with these MMSI numbers. Separate MMSIs with commas.
  clear_map_on_startup:
    name: Clear Ship Entities on Startup
    description: Clears all ship entities from the map when add-on starts.
  map_timeout_minutes:
    name: Ship Entity Timeout (Minutes)
    description: How long before a ship with no new tracking data is removed from the map.
