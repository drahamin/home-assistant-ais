<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1719">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baiamonte AIS TV">
  <title>Baiamonte AIS · TV Map</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=277">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=277">
  <link rel="manifest" href="manifest.webmanifest?v=277">
  <link rel="stylesheet" href="tv.css?v=2711">
</head>
<body>
  <main id="tv-shell">
    <section id="map" aria-label="Live Baiamonte AIS vessel map">
      <div id="tiles" aria-hidden="true"></div>
      <div id="weather" aria-hidden="true"></div>
      <div id="shade" aria-hidden="true"></div>
      <div id="boats"></div>
      <div id="empty">Waiting for vessels</div>
      <div id="tv-area-switch" class="tv-area-switch" aria-label="AIS map area"></div>
      <div id="weather-credit" hidden><i></i><span id="weather-time">Live precipitation</span><a href="https://www.rainviewer.com/" target="_blank" rel="noreferrer">RainViewer radar</a></div>
      <div class="tv-map-controls"><button type="button" id="tv-vessels-toggle" aria-pressed="true">Vessels</button><button type="button" id="tv-map-in" aria-label="Zoom map in">+</button><button type="button" id="tv-map-out" aria-label="Zoom map out">−</button><button type="button" id="tv-map-reset" aria-label="Reset map to the fixed AIS home location">Reset</button></div>
      <a id="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap contributors</a>
    </section>
    <aside id="fleet" aria-label="Live vessel list">
      <header class="fleet-head">
        <img src="brand-icon.png" alt="">
        <div><span>TENUTA BAIAMONTE</span><h1>Live vessels</h1></div>
        <b id="fleet-count">0</b>
      </header>
      <div id="vessel-list" tabindex="0" aria-label="All live vessels; use arrow keys to scroll"></div>
      <footer><i id="feed-light"></i><span id="feed-status">Connecting to Baiamonte AIS</span></footer>
    </aside>
  </main>
  <script src="maritime-flags.js?v=231"></script>
  <script src="tv.js?v=2711"></script>
</body>
</html>
