name: "Baiamonte AIS"
version: "2.0.0"
slug: "baiamonte_ais"
description: "Estate maritime watch and live AIS vessel operations"
url: "https://github.com/drahamin/home-assistant-ais"
arch:
  - "aarch64"
  - "amd64"
image: "ghcr.io/drahamin/home-assistant-ais"
startup: "application"
boot: "auto"
icon: "icon.png"
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Optional direct web access port (Home Assistant ingress does not require it)"
panel_icon: "mdi:radar"
panel_title: "AIS"
panel_admin: true
options:
  api_key: ""
  longitude_west: 1.20
  latitude_south: 50.90
  longitude_east: 1.80
  latitude_north: 51.20
  enable_map_entities: false
  include_class_b: true
  vessel_watchlist: ""
  clear_map_on_startup: false
  map_timeout_minutes: 30
  enable_api_monitoring: true
schema:
  api_key: "password"
  longitude_west: "float"
  latitude_south: "float"
  longitude_east: "float"
  latitude_north: "float"
  enable_map_entities: "bool?"
  include_class_b: "bool?"
  vessel_watchlist: "str?"
  clear_map_on_startup: "bool?"
  map_timeout_minutes: "int?"
  enable_api_monitoring: "bool?"
