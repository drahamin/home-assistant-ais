name: "Baiamonte AIS"
version: "2.7.11"
slug: "baiamonte_ais"
description: "Estate maritime watch and live AIS vessel operations"
url: "https://github.com/drahamin/home-assistant-ais"
arch:
  - "aarch64"
  - "amd64"
image: "ghcr.io/drahamin/home-assistant-ais"
startup: "application"
boot: "auto"
icon: "icon.png"
init: false
usb: true
uart: true
udev: true
homeassistant_api: true
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8999
  10110/udp: 10110
ports_description:
  8099/tcp: "TV map on host port 8999 and optional direct web access"
  10110/udp: "Local AIS receiver NMEA input"
panel_icon: "mdi:ferry"
panel_title: "AIS"
panel_admin: true
options:
  aishub_username: ""
  aishub_feed_host: ""
  aishub_feed_port: 0
  aishub_sharing_enabled: false
  baiamonte_api_enabled: true
  rahamin_miami_enabled: true
  rahamin_proxy_enabled: true
  rahamin_proxy_url: "http://192.168.86.196:8999/api/status"
  rahamin_proxy_interval: 15
  default_map_area: "baiamonte"
  tv_default_map_area: "baiamonte"
  dashboard_map_vessels: true
  tv_map_vessels: true
  tv_live_traffic_only: true
  baiamonte_approach_km: 45
  miami_approach_km: 45
  miami_longitude_west: -80.45
  miami_latitude_south: 25.55
  miami_longitude_east: -79.85
  miami_latitude_north: 26.15
  receiver_name: "Nooelec NESDR SMArt v5"
  receiver_mode: "sdr"
  receiver_host: ""
  receiver_port: 10110
  receiver_serial_device: "auto"
  receiver_serial_baud: 38400
  receiver_channel: "dual"
  sdr_device: "0"
  sdr_gain: "auto"
  sdr_ppm: 0
  sdr_rtl_agc: true
  sdr_bias_tee: false
  sdr_bandwidth: "192K"
  marine_vhf_enabled: false
  marine_vhf_device: "1"
  marine_vhf_frequencies: "156.800,156.450,156.600,156.700,156.625"
  marine_vhf_labels: "Channel 16 Distress,Channel 9 Calling,Channel 12 Port Operations,Channel 14 Port Operations,Channel 72 Ship-to-Ship"
  marine_vhf_gain: 28
  marine_vhf_ppm: 0
  marine_vhf_squelch: -28
  GPS_USE_USB: true
  GPS_DEVICE: "auto"
  GPS_BAUD: 9600
  WEATHER_OVERLAY_DASHBOARD: true
  FLIGHTAWARE_WEATHER_ENABLED: false
  FLIGHTAWARE_AEROAPI_KEY: ""
  FLIGHTAWARE_AIRPORT: "LICC"
  tv_weather_overlay: false
  tv_weather_opacity: 65
  map_style: "standard"
  longitude_west: 12.93
  latitude_south: 35.85
  longitude_east: 16.93
  latitude_north: 39.85
  enable_map_entities: false
  include_class_b: true
  vessel_watchlist: ""
  clear_map_on_startup: false
  map_timeout_minutes: 30
schema:
  aishub_username: "str"
  aishub_feed_host: "str?"
  aishub_feed_port: "int?"
  aishub_sharing_enabled: "bool?"
  baiamonte_api_enabled: "bool?"
  rahamin_miami_enabled: "bool?"
  rahamin_proxy_enabled: "bool?"
  rahamin_proxy_url: "str?"
  rahamin_proxy_interval: "int?"
  default_map_area: "list(baiamonte|miami)?"
  tv_default_map_area: "list(baiamonte|miami)?"
  dashboard_map_vessels: "bool?"
  tv_map_vessels: "bool?"
  tv_live_traffic_only: "bool?"
  baiamonte_approach_km: "int?"
  miami_approach_km: "int?"
  miami_longitude_west: "float?"
  miami_latitude_south: "float?"
  miami_longitude_east: "float?"
  miami_latitude_north: "float?"
  receiver_name: "str?"
  receiver_mode: "list(sdr|udp|tcp|serial)?"
  receiver_host: "str?"
  receiver_port: "int?"
  receiver_serial_device: "str?"
  receiver_serial_baud: "int?"
  receiver_channel: "list(dual|channel_a|channel_b)?"
  sdr_device: "str?"
  sdr_gain: "str?"
  sdr_ppm: "int?"
  sdr_rtl_agc: "bool?"
  sdr_bias_tee: "bool?"
  sdr_bandwidth: "list(OFF|192K|288K)?"
  marine_vhf_enabled: "bool?"
  marine_vhf_device: "str?"
  marine_vhf_frequencies: "str?"
  marine_vhf_labels: "str?"
  marine_vhf_gain: "float?"
  marine_vhf_ppm: "int?"
  marine_vhf_squelch: "int?"
  GPS_USE_USB: "bool?"
  GPS_DEVICE: "str?"
  GPS_BAUD: "int?"
  WEATHER_OVERLAY_DASHBOARD: "bool?"
  FLIGHTAWARE_WEATHER_ENABLED: "bool?"
  FLIGHTAWARE_AEROAPI_KEY: "str?"
  FLIGHTAWARE_AIRPORT: "str?"
  tv_weather_overlay: "bool?"
  tv_weather_opacity: "int?"
  map_style: "list(standard|humanitarian|topographic|dark|satellite)?"
  longitude_west: "float"
  latitude_south: "float"
  longitude_east: "float"
  latitude_north: "float"
  enable_map_entities: "bool?"
  include_class_b: "bool?"
  vessel_watchlist: "str?"
  clear_map_on_startup: "bool?"
  map_timeout_minutes: "int?"
configuration:
  aishub_username:
    name: AISHub Username
    description: Username supplied by AISHub after your contributor feed is approved.
  aishub_feed_host:
    name: AISHub Feed Host
    description: Destination host supplied by AISHub for your raw NMEA contribution.
  aishub_feed_port:
    name: AISHub Feed Port
    description: Dedicated UDP destination port supplied by AISHub.
  baiamonte_api_enabled:
    name: Baiamonte Sicily API Area
    description: Fetch Baiamonte Sicily vessels and approaching traffic from the configured AISHub API.
  rahamin_miami_enabled:
    name: Rahamin Miami API Area
    description: Fetch local and inbound Miami vessels from the same configured AISHub API.
  rahamin_proxy_enabled:
    name: Rahamin AIS Private Proxy
    description: Import the separate Miami and Sicily cached vessel feeds from the Rahamin AIS Pi over the private routed network.
  rahamin_proxy_url:
    name: Rahamin AIS Proxy URL
    description: Private Rahamin AIS status endpoint. The standard Miami Pi endpoint is http://192.168.86.196:8999/api/status.
  rahamin_proxy_interval:
    name: Rahamin AIS Proxy Refresh
    description: Seconds between private Miami and Sicily vessel updates. Recommended value is 15.
  default_map_area:
    name: Default Map Area
    description: Choose whether dashboards open on Baiamonte Sicily or Rahamin Miami.
  tv_default_map_area:
    name: TV Default Map Area
    description: Area opened by /tv when no area is supplied. Keep Baiamonte selected for the local Sicily traffic display.
  dashboard_map_vessels:
    name: Show Vessels on Dashboard Map
    description: Show live vessel markers on the Home Assistant Overview map. They can also be hidden temporarily from the map toolbar.
  tv_map_vessels:
    name: Show Vessels on TV Map
    description: Show live vessel markers on /tv. They can also be hidden temporarily from the TV map controls.
  tv_live_traffic_only:
    name: TV Live Traffic Only
    description: Keep the TV count and vessel list matched to boats actually inside the displayed map instead of approach traffic outside its edges.
  baiamonte_approach_km:
    name: Baiamonte Approach Range
    description: Extra kilometres around the Sicily map requested for inbound-vessel detection.
  miami_approach_km:
    name: Miami Approach Range
    description: Extra kilometres around the Miami map requested for inbound-vessel detection.
  miami_longitude_west:
    name: Miami Bounding Box - West
    description: Left edge of the Rahamin Miami local-vessel map.
  miami_latitude_south:
    name: Miami Bounding Box - South
    description: Bottom edge of the Rahamin Miami local-vessel map.
  miami_longitude_east:
    name: Miami Bounding Box - East
    description: Right edge of the Rahamin Miami local-vessel map.
  miami_latitude_north:
    name: Miami Bounding Box - North
    description: Top edge of the Rahamin Miami local-vessel map.
  receiver_name:
    name: AIS Receiver Name
    description: Friendly hardware name shown in logs and connection status.
  receiver_mode:
    name: AIS Receiver Connection
    description: Use the included AIS-catcher with an RTL-SDR, or receive decoded NMEA by UDP, TCP, or serial.
  receiver_host:
    name: AIS Receiver Host
    description: Network address used in TCP mode. Leave blank for UDP listener or serial mode.
  receiver_port:
    name: AIS Receiver Port
    description: UDP listening port or TCP destination port. The standard Baiamonte port is 10110.
  receiver_serial_device:
    name: AIS Serial Device
    description: Use auto to detect a serial AIS radio, or enter a path such as /dev/ttyUSB0.
  receiver_serial_baud:
    name: AIS Serial Baud Rate
    description: NMEA speed for a serial AIS radio. Most AIS receivers use 38400.
  receiver_channel:
    name: AIS Radio Channels
    description: Document whether the attached radio receives both AIS channels, channel A 161.975 MHz, or channel B 162.025 MHz.
  sdr_device:
    name: RTL-SDR Device
    description: Device index such as 0, or the dongle serial number when more than one RTL-SDR is attached.
  sdr_gain:
    name: RTL-SDR Tuner Gain
    description: Use auto for the recommended starting point, or enter a manual gain from 0 to 50 dB.
  sdr_ppm:
    name: RTL-SDR Frequency Correction
    description: Frequency correction from -150 to 150 PPM. Start at 0 for the temperature-compensated NESDR SMArt v5.
  sdr_rtl_agc:
    name: RTL-SDR Automatic Gain
    description: Enables RTL automatic gain control. Recommended as the initial AIS-catcher setting.
  sdr_bias_tee:
    name: RTL-SDR Bias Tee
    description: Keep off for the NESDR SMArt v5 unless your exact radio and an attached active antenna or LNA explicitly require DC power.
  sdr_bandwidth:
    name: AIS Decoder Bandwidth
    description: 192K is the recommended AIS-catcher starting filter. Use Off only while diagnosing reception.
  marine_vhf_enabled:
    name: Enable Marine VHF Receiver
    description: Use a second RTL-SDR as a receive-only marine VHF scanner with live dashboard audio.
  marine_vhf_device:
    name: Marine VHF RTL-SDR Device
    description: Use device index 1 for the second Nooelec, or enter its unique serial number. It must differ from the AIS device.
  marine_vhf_frequencies:
    name: Marine VHF Frequencies
    description: Comma-separated receive frequencies in MHz. Confirm the channels used in your local waters.
  marine_vhf_labels:
    name: Marine VHF Channel Labels
    description: Comma-separated labels matching the configured frequencies.
  marine_vhf_gain:
    name: Marine VHF Gain
    description: RTL-SDR tuner gain from 0 to 50 dB. Start at 28 and adjust for the antenna and local signal level.
  marine_vhf_ppm:
    name: Marine VHF Frequency Correction
    description: Frequency correction from -150 to 150 PPM. Start at 0 for a NESDR SMArt v5.
  marine_vhf_squelch:
    name: Marine VHF Squelch
    description: Signal threshold from -100 to 0 dBFS. Start at -28; move toward 0 if noise opens the receiver.
  GPS_USE_USB:
    name: Use Attached USB GPS
    description: Use a recent NMEA GPS fix as the estate reference position for distance ranking and maps.
  GPS_DEVICE:
    name: USB GPS Device
    description: Use auto to detect a GPS or enter a path such as /dev/ttyACM0.
  GPS_BAUD:
    name: GPS Baud Rate
    description: Serial speed used by the attached GPS. Most USB GPS units use 9600.
  WEATHER_OVERLAY_DASHBOARD:
    name: Live Rain Radar on Dashboard
    description: Show current RainViewer precipitation radar on the Overview map.
  FLIGHTAWARE_WEATHER_ENABLED:
    name: FlightAware Airport Weather
    description: Show AeroAPI airport observations on the Watch Area page. Requires an AeroAPI key.
  FLIGHTAWARE_AEROAPI_KEY:
    name: FlightAware AeroAPI Key
    description: Optional FlightAware AeroAPI v4 key used only when airport weather is enabled.
  FLIGHTAWARE_AIRPORT:
    name: FlightAware Weather Airport
    description: ICAO airport code for weather observations. LICC is Catania Fontanarossa.
  tv_weather_overlay:
    name: TV Live Weather Radar
    description: Show the current RainViewer precipitation radar over the TV vessel map.
  tv_weather_opacity:
    name: TV Weather Opacity
    description: Weather radar visibility from 10 to 100 percent. Recommended value is 65.
  map_style:
    name: Base Map Style
    description: Choose Standard, Humanitarian, Topographic, Dark, or Satellite tiles for the dashboard and TV maps.
  longitude_west:
    name: Bounding Box - Bottom-Left Longitude (West)
    description: Left edge of your tracking zone.
  latitude_south:
    name: Bounding Box - Bottom-Left Latitude (South)
    description: Bottom edge of your tracking zone.
  longitude_east:
    name: Bounding Box - Top-Right Longitude (East)
    description: Right edge of your tracking zone.
  latitude_north:
    name: Bounding Box - Top-Right Latitude (North)
    description: Top edge of your tracking zone.
  enable_map_entities:
    name: Multi-Ship Tracking
    description: Creates an individual sensor for every tracked ship.
  include_class_b:
    name: Include Class B Vessels
    description: Retained for compatibility; AISHub returns the available vessels in your selected area.
  vessel_watchlist:
    name: MMSI Filter
    description: Only track vessels with these MMSI numbers. Separate MMSIs with commas.
  clear_map_on_startup:
    name: Clear Ship Entities on Startup
    description: Clears all ship entities from the map when the app starts.
  map_timeout_minutes:
    name: Ship Entity Timeout (Minutes)
    description: How long before a ship with no updated data is removed from the map.
