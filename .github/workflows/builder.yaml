name: Build Home Assistant app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tuya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Test Baiamonte Tuya
        run: python -m unittest discover -s baiamonte_tuya/tests -p "test_*.py"

  build-ais:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      app_path: ./ais_ship_tracker
      image_name: home-assistant-ais
      app_name: Baiamonte AIS
      app_description: Estate maritime watch and live AIS vessel operations
    secrets: inherit

  build-growatt-usb:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      app_path: ./baiamonte_growatt_usb
      image_name: home-assistant-growatt-usb
      app_name: Baiamonte Growatt USB
      app_description: Local Growatt SPF USB telemetry and guided diagnostics
    secrets: inherit

  build-dashboard-vpn:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      app_path: ./baiamonte_dashboard_vpn
      image_name: home-assistant-dashboard-vpn
      app_name: Baiamonte Dashboard VPN
      app_description: Always-on CloudConnexa tunnel and private dashboard proxy
    secrets: inherit

  build-netatmo-bridge:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      app_path: ./baiamonte_netatmo_bridge
      image_name: home-assistant-netatmo-bridge
      app_name: Baiamonte Netatmo
      app_description: Local-first Legrand and Netatmo control with cloud fallback
    secrets: inherit

  build-tuya:
    needs: test-tuya
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      app_path: ./baiamonte_tuya
      image_name: home-assistant-tuya
      app_name: Baiamonte Tuya
      app_description: Local-first Tuya operations with optional cloud fallback
    secrets: inherit
