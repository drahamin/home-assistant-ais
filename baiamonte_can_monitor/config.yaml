name: "Baiamonte CAN Monitor"
version: "0.3.0"
slug: "baiamonte_can_monitor"
description: "Receive-only Growatt and Felicity battery CAN monitoring"
url: "https://github.com/drahamin/home-assistant-ais"
icon: "icon.png"
arch:
  - "aarch64"
  - "amd64"
startup: "application"
boot: "auto"
init: false
usb: true
uart: true
udev: true
homeassistant_api: true
ingress: true
ingress_port: 8098
panel_icon: "mdi:car-battery"
panel_title: "CAN"
panel_admin: true
stage: "stable"
watchdog: "http://[HOST]:[PORT:8098]/api/status"
options:
  adapter: "auto"
  bus_mode: "listen_only"
  bitrate: 500000
  serial_device: "auto"
  serial_baudrate: 115200
  stale_after_seconds: 30
  publish_interval_seconds: 2
schema:
  adapter: "list(auto|gs_usb|slcan)"
  bus_mode: "list(listen_only|standalone_ack)"
  bitrate: "list(125000|250000|500000|1000000)"
  serial_device: "str"
  serial_baudrate: "list(115200|250000|500000|1000000|2000000)"
  stale_after_seconds: "int"
  publish_interval_seconds: "int"
configuration:
  adapter:
    name: CAN adapter mode
    description: Auto tries candleLight/gs_usb first, then a serial CANable. The selected CAN participation mode controls whether the adapter is passive or acknowledges received frames.
  bus_mode:
    name: CAN participation mode
    description: Use listen_only when tapping an active inverter-to-battery bus. Use standalone_ack when the CANable is connected directly to the battery without a working inverter; it acknowledges CAN frames but the app never sends data or control commands.
  bitrate:
    name: CAN bus speed
    description: Growatt BMS CAN v1.04 uses 500000 bit/s.
  serial_device:
    name: Serial CAN device
    description: Keep auto unless the CANable appears as a tty device. The Growatt direct USB is not selected automatically.
  serial_baudrate:
    name: CANable USB serial speed
    description: USB-side speed used only with slcan firmware.
  stale_after_seconds:
    name: Data timeout
    description: Mark the connection offline when no CAN frame is received for this many seconds.
  publish_interval_seconds:
    name: Home Assistant update interval
    description: Minimum number of seconds between state updates.
