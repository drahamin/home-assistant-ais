name: "Baiamonte Battery Monitor"
version: "0.6.2"
slug: "baiamonte_can_monitor"
description: "Read-only Felicity battery monitoring over CAN or RS485"
url: "https://github.com/drahamin/home-assistant-ais"
icon: "icon.png"
arch:
  - "aarch64"
  - "amd64"
startup: "application"
boot: "auto"
init: false
usb: true
uart: true
udev: true
homeassistant_api: true
ingress: true
ingress_port: 8098
panel_icon: "mdi:car-battery"
panel_title: "Battery"
panel_admin: true
stage: "stable"
watchdog: "http://[HOST]:[PORT:8098]/api/status"
options:
  adapter: "felicity_rs485"
  bus_mode: "listen_only"
  growatt_heartbeat: false
  bitrate: 500000
  serial_device: "auto"
  serial_baudrate: 115200
  rs485_baudrate: 9600
  battery_addresses: "1,2"
  stale_after_seconds: 30
  publish_interval_seconds: 5
  recovery_control_enabled: false
  generator_input_switch: "switch.generator_main_breaker_switch"
  generator_voltage_sensor: "sensor.generator_main_breaker_phase_a_voltage"
  generator_available_voltage: 180
  recovery_start_soc: 20
  recovery_stop_soc: 90
  recovery_minimum_dwell_seconds: 900
schema:
  adapter: "list(auto|gs_usb|slcan|felicity_rs485)"
  bus_mode: "list(listen_only|standalone_ack)"
  growatt_heartbeat: "bool"
  bitrate: "list(125000|250000|500000|1000000)"
  serial_device: "str"
  serial_baudrate: "list(115200|250000|500000|1000000|2000000)"
  rs485_baudrate: "list(9600|19200)"
  battery_addresses: "str"
  stale_after_seconds: "int"
  publish_interval_seconds: "int"
  recovery_control_enabled: "bool"
  generator_input_switch: "str"
  generator_voltage_sensor: "str"
  generator_available_voltage: "int"
  recovery_start_soc: "int"
  recovery_stop_soc: "int"
  recovery_minimum_dwell_seconds: "int"
configuration:
  adapter:
    name: Battery connection
    description: Felicity RS485 is the installed dual-battery connection. CAN modes remain available for future diagnostics.
  bus_mode:
    name: CAN participation mode
    description: Use listen_only when tapping an active inverter-to-battery bus. Use standalone_ack when the CANable is connected directly to the battery without a working inverter; it acknowledges CAN frames but the app never sends data or control commands.
  growatt_heartbeat:
    name: Growatt battery heartbeat
    description: In standalone mode, send only the documented Growatt 0x301 heartbeat once per second so a compatible battery reports its status. No charge, discharge, firmware, or configuration commands are available.
  bitrate:
    name: CAN bus speed
    description: Growatt BMS CAN v1.04 uses 500000 bit/s.
  serial_device:
    name: USB adapter device
    description: Use the stable /dev/serial/by-id path for the battery RS485 adapter so reboots cannot change the connection.
  serial_baudrate:
    name: CANable USB serial speed
    description: USB-side speed used only with slcan firmware.
  rs485_baudrate:
    name: Felicity RS485 speed
    description: LPBA batteries normally use Modbus RTU at 9600 baud, 8N1.
  battery_addresses:
    name: Felicity battery addresses
    description: Comma-separated read-only Modbus addresses. Baiamonte Battery 1 and Battery 2 use addresses 1,2.
  stale_after_seconds:
    name: Data timeout
    description: Mark the connection or a battery offline when no valid reply is received for this many seconds.
  publish_interval_seconds:
    name: Home Assistant update interval
    description: Minimum number of seconds between state updates.
  recovery_control_enabled:
    name: Automatic recovery control
    description: Guarded control of the configured generator input switch. Leave off until the physical switch action is verified. The controller never writes to the battery BMS and cannot regulate current.
  generator_input_switch:
    name: Generator input switch
    description: Existing Home Assistant switch that connects or disconnects generator AC from the inverter. It must not be a generator starter.
  generator_voltage_sensor:
    name: Generator voltage sensor
    description: Existing Home Assistant voltage sensor used to prove generator power is available before closing the input switch.
  generator_available_voltage:
    name: Generator available voltage
    description: Minimum measured generator voltage required before the controller may close the input switch.
  recovery_start_soc:
    name: Recovery start SOC
    description: Close the verified generator input switch below this bank SOC when charging is safe.
  recovery_stop_soc:
    name: Recovery stop SOC
    description: Open the generator input switch above this SOC only after the bank is balanced.
  recovery_minimum_dwell_seconds:
    name: Minimum switching interval
    description: Anti-cycling delay between automatic generator input commands; a minimum of 300 seconds is enforced.
