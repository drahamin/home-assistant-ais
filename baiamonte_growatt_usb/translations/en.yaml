configuration:
  device:
    name: Growatt USB device
    description: Use auto to find the inverter, or enter a stable path such as /dev/serial/by-id/... or /dev/ttyUSB0.
  transport:
    name: Connection transport
    description: Auto tries Growatt RS485 Modbus on serial adapters, then direct USB protocols.
  protocol:
    name: Inverter protocol
    description: Auto tests Growatt Modbus RTU v0.14 and common SPF direct USB protocols.
  baud_rate:
    name: Serial speed
    description: Growatt SPF direct USB normally uses 2400 baud.
  modbus_baud_rate:
    name: RS485 speed
    description: The SPF 5000 ES RS485 connection normally uses 9600 baud.
  modbus_slave_id:
    name: RS485 inverter address
    description: Growatt uses Modbus address 1 by default.
  poll_interval_seconds:
    name: Update interval
    description: Seconds between live inverter readings. Ten seconds is recommended.
  stale_after_seconds:
    name: Offline timeout
    description: Mark telemetry offline after this many seconds without a valid response.
  publish_to_home_assistant:
    name: Create Home Assistant sensors
    description: Publish readings as sensor.baiamonte_growatt_* entities.
  fallback_enabled:
    name: Offline incoming-power fallback
    description: Continue incoming power and energy from the local load and battery balance when Growatt is offline.
  fallback_load_power_entity:
    name: Estate load power entity
    description: Home Assistant sensor for the estate's current power use.
  fallback_battery_power_entity:
    name: Battery bank power entity
    description: Signed Home Assistant battery power sensor used in the balance.
  fallback_battery_power_positive_is_discharge:
    name: Positive battery power means discharge
    description: Keep enabled for Baiamonte battery telemetry; charging is negative and discharging is positive.
  fallback_source_stale_seconds:
    name: Fallback source timeout
    description: Reject load or battery readings older than this many seconds.
  fallback_poll_interval_seconds:
    name: Fallback update interval
    description: Seconds between local balance updates.
  fallback_learning_enabled:
    name: Learn estimate calibration
    description: Learn a bounded conversion-loss correction while direct Growatt power is available.
  read_only:
    name: Read-only safety lock
    description: Keep enabled for monitoring. Disable it only with the separate setting-change option during commissioning.
  allow_setting_changes:
    name: Allow inverter setting changes
    description: Enables the guarded editor when read-only mode is off. Every command requires confirmation and read-back.
  firmware_tools_enabled:
    name: Enable firmware maintenance tools
    description: Allows version checks, settings backup, and validation/staging of an official package. It never enables undocumented flashing.
  firmware_max_package_mb:
    name: Maximum firmware package size
    description: Reject firmware packages larger than this many megabytes.
