configuration:
  device:
    name: Dispositivo USB Growatt
    description: Usa auto per trovare l'inverter oppure inserisci un percorso stabile come /dev/serial/by-id/... o /dev/ttyUSB0.
  transport:
    name: Trasporto connessione
    description: Auto prova prima Growatt RS485 Modbus sugli adattatori seriali, poi i protocolli USB diretti.
  protocol:
    name: Protocollo inverter
    description: Auto prova Growatt Modbus RTU v0.14 e i protocolli USB diretti SPF comuni.
  baud_rate:
    name: Velocità seriale
    description: La connessione USB diretta Growatt SPF normalmente usa 2400 baud.
  modbus_baud_rate:
    name: Velocità RS485
    description: La connessione RS485 dello SPF 5000 ES normalmente usa 9600 baud.
  modbus_slave_id:
    name: Indirizzo inverter RS485
    description: Growatt usa l'indirizzo Modbus 1 come predefinito.
  poll_interval_seconds:
    name: Intervallo aggiornamento
    description: Secondi tra le letture. Dieci secondi è il valore consigliato.
  stale_after_seconds:
    name: Timeout dati
    description: Segna la telemetria offline dopo questo tempo senza una risposta valida.
  publish_to_home_assistant:
    name: Crea sensori Home Assistant
    description: Pubblica le letture come entità sensor.baiamonte_growatt_*.
  read_only:
    name: Blocco sicurezza sola lettura
    description: Mantienilo attivo per il monitoraggio. Disattivalo solo insieme all'opzione modifiche durante la configurazione.
  allow_setting_changes:
    name: Consenti modifiche inverter
    description: Abilita l'editor protetto quando la sola lettura è disattivata. Ogni comando richiede conferma e rilettura.
